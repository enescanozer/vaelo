# Codemagic CI/CD — Vaelo mobil (Expo SDK 52, managed workflow)
workflows:
  android-test:
    name: Vaelo Android (test APK)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20.11.0
    scripts:
      - name: Bağımlılıkları kur
        script: |
          cd mobil
          npm ci
      - name: Expo prebuild (android/ üret)
        script: |
          cd mobil
          npx expo prebuild --platform android --clean --no-install
      - name: Debug APK derle (imza gerektirmez)
        script: |
          cd mobil/android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobil/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - canenesqy@gmail.com
        notify:
          success: true
          failure: true

  ios-simulator:
    name: Vaelo iOS (simülatör — Appetize)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bağımlılıkları kur
        script: |
          cd mobil
          npm ci
      - name: Expo prebuild (ios/ üret)
        script: |
          cd mobil
          npx expo prebuild --platform ios --clean --no-install
      - name: CocoaPods kur
        script: |
          cd mobil/ios
          pod install
      - name: Simülatör için derle (imzasız)
        script: |
          cd mobil/ios
          SCHEME=$(ls -d *.xcworkspace | sed 's/\.xcworkspace$//')
          echo "Şema tespit edildi: $SCHEME"
          
          xcodebuild \
            -workspace "$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: .app'i zip'le (Appetize için)
        script: |
          cd mobil/ios
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Bulunan .app yolu: $APP_PATH"
            cd "$(dirname "$APP_PATH")"
            zip -r $CM_BUILD_DIR/vaelo-sim.zip "$(basename "$APP_PATH")"
          else
            echo "HATA: .app klasörü üretilemedi!"
            exit 1
          fi
    artifacts:
      - "*.zip"
    publishing:
      email:
        recipients:
          - canenesqy@gmail.com
        notify:
          success: true
          failure: true